entity_overview_transform.overview_result:
  path: '/transform/overview_result/{overview}'
  defaults:
    _title: 'Transforms overview result into JSON response.'
    _controller: '\Drupal\entity_overview_transform\Controller\TransformController::overviewResult'
  methods: [GET]
  options:
    _auth: ['jwt_auth', 'basic_auth', 'cookie', 'oauth2']
  requirements:
    _access: 'TRUE'
    _format: json

entity_overview_transform.overview_result.transform_mode:
  path: '/transform/overview_result/{overview}/{transform_mode}'
  defaults:
    _title: 'Transforms overview result into JSON response.'
    _controller: '\Drupal\entity_overview_transform\Controller\TransformController::overviewResult'
  methods: [GET]
  options:
    _auth: ['jwt_auth', 'basic_auth', 'cookie', 'oauth2']
  requirements:
    _access: 'TRUE'
    _format: json
